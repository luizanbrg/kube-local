apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kubequest-app.fullname" . }}-test-connection"
  labels:
    {{- include "kubequest-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  # Same rules as the app pods (admission policies 01-non-root and 02-resources)
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: curl
      # Reuse the app image: no external image needed (private registry policy)
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command: ['curl']
      args: ['--fail', '--silent', '--show-error','http://{{ include "kubequest-app.fullname" . }}:{{ .Values.service.port }}']
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  restartPolicy: Never
