apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kubequest-p3
servers: 1
agents: 2
image: rancher/k3s:v1.32.5-k3s1
ports:
  - port: 127.0.0.1:8080:30080
    nodeFilters:
      - server:0
  - port: 127.0.0.1:8443:30443
    nodeFilters:
      - server:0
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
