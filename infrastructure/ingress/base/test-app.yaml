# Namespace de test uniquement : aucune dependance envers l'application P2.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-test
  labels:
    app.kubernetes.io/part-of: kubequest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-test
  namespace: ingress-test
  labels:
    app.kubernetes.io/name: ingress-test
    app.kubernetes.io/part-of: kubequest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-test
        app.kubernetes.io/part-of: kubequest
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          args:
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-test
  namespace: ingress-test
  labels:
    app.kubernetes.io/name: ingress-test
    app.kubernetes.io/part-of: kubequest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingress-test
  ports:
    - name: http
      port: 80
      targetPort: http
