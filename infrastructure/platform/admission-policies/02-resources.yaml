# Règle 2 : chaque conteneur (initContainers compris) déclare requests ET limits, CPU ET mémoire.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubequest-resources
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kubequest
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
    - name: missing
      expression: >-
        variables.containers.filter(c,
          !(has(c.resources) &&
            has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
            has(c.resources.limits) && 'cpu' in c.resources.limits && 'memory' in c.resources.limits))
  validations:
    - expression: "size(variables.missing) == 0"
      messageExpression: >-
        'resources.requests et resources.limits (cpu + memory) sont obligatoires. Conteneurs en faute : ' +
        variables.missing.map(c, c.name).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubequest-resources
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kubequest
spec:
  policyName: kubequest-resources
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kubequest-app
