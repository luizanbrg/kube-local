# Chaque objet viole UNE seule règle : chacun doit être REFUSÉ avec un message clair.
# 1a) root via runAsUser: 0
apiVersion: v1
kind: Pod
metadata:
  name: bad-root
  namespace: kubequest-app
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/instance: bad-root
    app.kubernetes.io/part-of: kubequest
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/epitechmscpropromo2027/t-clo-901-nce-9-1-kube-4/kubequest-app:0.1.0
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
---
# 1b) conteneur privileged (Kubernetes interdit déjà privileged + allowPrivilegeEscalation: false,
#     donc ce conteneur ne met pas allowPrivilegeEscalation)
apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: kubequest-app
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/instance: bad-privileged
    app.kubernetes.io/part-of: kubequest
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/epitechmscpropromo2027/t-clo-901-nce-9-1-kube-4/kubequest-app:0.1.0
      securityContext:
        privileged: true
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
---
