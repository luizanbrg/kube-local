---
# 5) Deployment sans readinessProbe
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-no-readiness
  namespace: kubequest-app
  labels: &labels
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/instance: bad-no-readiness
    app.kubernetes.io/part-of: kubequest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bad-no-readiness
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/epitechmscpropromo2027/t-clo-901-nce-9-1-kube-4/kubequest-app:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
