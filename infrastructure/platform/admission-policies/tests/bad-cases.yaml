# 4) label part-of manquant
apiVersion: v1
kind: Pod
metadata:
  name: bad-labels
  namespace: kubequest-app
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/instance: bad-labels
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/epitechmscpropromo2027/t-clo-901-nce-9-1-kube-4/kubequest-app:0.1.0
