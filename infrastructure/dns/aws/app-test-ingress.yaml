# Route temporaire de validation DNS, a retirer avant l'Ingress Laravel de P2.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-dns-test
  namespace: ingress-test
  labels:
    app.kubernetes.io/name: ingress-test
    app.kubernetes.io/part-of: kubequest
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app.3.120.212.20.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-test
                port:
                  number: 80
