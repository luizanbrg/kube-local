apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth
resources:
  - ../base
  - https.yaml
patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak
      spec:
        template:
          spec:
            containers:
              - name: keycloak
                env:
                  - name: KC_HOSTNAME
                    value: https://keycloak.127.0.0.1.sslip.io:8443
  - target:
      kind: StatefulSet
      name: keycloak-db
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
