apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: keycloak-local-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-local-tls
spec:
  secretName: keycloak-local-tls
  dnsNames:
    - keycloak.127.0.0.1.sslip.io
  issuerRef:
    name: keycloak-local-selfsigned
    kind: Issuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - keycloak.127.0.0.1.sslip.io
      secretName: keycloak-local-tls
  rules:
    - host: keycloak.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
