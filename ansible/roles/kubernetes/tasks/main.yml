---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: 'https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key'
    dest: /tmp/kubernetes-release.key
    mode: '0644'
  become: true

- name: Install Kubernetes repository signing key
  ansible.builtin.shell:
    cmd: >
      gpg --dearmor
      --yes
      --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /tmp/kubernetes-release.key
  become: true
  changed_when: false

- name: Add Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: 'https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/'
    suites: /
    signed_by: 'https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key'
    state: present
  become: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true
  become: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: '{{ item }}'
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
  become: true
