---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - apt-transport-https
      - chrony
    state: present
  become: true

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  become: true

# Verify that Chrony is actually synchronized
- name: Wait for Chrony time synchronization
  ansible.builtin.command:
    cmd: chronyc waitsync 12 1 0 10
  register: chrony_sync
  changed_when: false
  retries: 2
  delay: 10
  until: chrony_sync.rc == 0

- name: Display Chrony synchronization status
  ansible.builtin.command:
    cmd: chronyc tracking
  register: chrony_tracking
  changed_when: false

- name: Show Chrony tracking information
  ansible.builtin.debug:
    var: chrony_tracking.stdout_lines

- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  become: true
  changed_when: false

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'
  become: true

- name: Configure required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Load overlay kernel module
  community.general.modprobe:
    name: overlay
    state: present
  become: true

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present
  become: true

- name: Configure Kubernetes sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Apply sysctl settings

- name: Configure Kubernetes node hostname resolution
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: '# {mark} ANSIBLE MANAGED KUBERNETES NODES'
    block: |
      {% for host in groups['kubernetes'] %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}
      {% endfor %}
  become: true
